<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111318">
<title>Читання</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  html,body{height:100%}
  body.reader{overflow-x:hidden}
  .reader-bar{position:fixed;left:0;right:0;z-index:20;background:linear-gradient(#000c,transparent);transition:transform .25s ease,opacity .25s ease;display:flex;align-items:center;gap:12px;padding:14px 16px}
  .reader-bar.bottom{background:linear-gradient(transparent,#000c);bottom:0;justify-content:space-between}
  .reader-bar.top{top:0}
  body.ui-hidden .reader-bar.top{transform:translateY(-100%);opacity:0}
  body.ui-hidden .reader-bar.bottom{transform:translateY(100%);opacity:0}
  body.ui-hidden .progress-track{opacity:0;pointer-events:none}
  .reader-bar a.back{color:var(--text);text-decoration:none;font-size:1.3rem;line-height:1}
  .reader-bar .meta{min-width:0;flex:1}
  .reader-bar .meta .t{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reader-bar .meta .c{color:var(--muted);font-size:.8rem}
  .reader-bar.bottom button{background:none;border:0;color:var(--text);font-size:1.2rem;padding:8px 14px;cursor:pointer;border-radius:8px}
  .reader-bar.bottom button:disabled{color:#4a5160;cursor:default}
  .reader-bar.bottom button:not(:disabled):active{background:#ffffff1a}
  .progress-track{position:fixed;right:8px;top:70px;bottom:70px;width:22px;z-index:20;display:flex;flex-direction:column;align-items:center;transition:opacity .25s ease}
  .progress-track .num{color:var(--muted);font-size:.7rem}
  .progress-track .track{position:relative;flex:1;width:3px;background:#ffffff26;border-radius:3px;margin:6px 0;cursor:pointer}
  .progress-track .thumb{position:absolute;left:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px #0006}
  #pages{max-width:var(--reader-width,720px);margin:0 auto;transition:max-width .2s ease}
  #pages img{display:block;width:100%;height:auto}
  #reader-status{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;color:var(--muted)}
  #reader-status a{color:var(--accent);text-decoration:none;font-weight:700}
</style>
</head>
<body class="reader">

<div id="reader-status">Завантаження…</div>

<header class="reader-bar top" hidden>
  <a class="back" href="#">←</a>
  <div class="meta"><div class="t"></div><div class="c"></div></div>
</header>

<div class="progress-track" hidden>
  <span class="num top">1</span>
  <div class="track"><div class="thumb"></div></div>
  <span class="num bottom">1</span>
</div>

<main id="pages"></main>

<footer class="reader-bar bottom" hidden>
  <button data-action="prev" title="Попередня глава">‹</button>
  <button data-action="top" title="Нагору">↑</button>
  <button data-action="list" title="Список глав">☰</button>
  <button data-action="wide" title="Ширина">⤢</button>
  <button data-action="next" title="Наступна глава">›</button>
</footer>

<script src="data/config.js"></script>
<script src="data/catalog.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const titleId = params.get("title");
  const chapterNum = params.get("chapter");
  const statusEl = document.getElementById("reader-status");
  const backLink = `chapters.html?title=${encodeURIComponent(titleId || "")}`;

  const title = window.CATALOG_DATA?.titles.find(t => t.id === titleId);
  if (!title || !chapterNum) {
    statusEl.innerHTML = `Тайтл або главу не знайдено.<br><a href="index.html">← До каталогу</a>`;
    return;
  }

  let manifest;
  try {
    const res = await fetch(`cubari/${encodeURIComponent(titleId)}.json`);
    if (!res.ok) throw new Error("no manifest");
    manifest = await res.json();
  } catch {
    statusEl.innerHTML = `Ще не вдалося завантажити цю главу.<br><a href="${backLink}">← До списку глав</a>`;
    return;
  }

  const chapter = manifest.chapters?.[String(chapterNum)];
  const pages = chapter?.groups?.Sub;
  if (!pages || !pages.length) {
    statusEl.innerHTML = `Ця глава ще не завантажена.<br><a href="${backLink}">← До списку глав</a>`;
    return;
  }

  // Список номерів глав тайтулу в тому ж порядку, що й на сторінці глав.
  const chapterNumbers = title.chapters.map(c => String(c.number));
  const idx = chapterNumbers.indexOf(String(chapterNum));
  const prevNum = idx > 0 ? chapterNumbers[idx - 1] : null;
  const nextNum = idx >= 0 && idx < chapterNumbers.length - 1 ? chapterNumbers[idx + 1] : null;

  statusEl.remove();

  const topBar = document.querySelector(".reader-bar.top");
  const bottomBar = document.querySelector(".reader-bar.bottom");
  const progressTrack = document.querySelector(".progress-track");
  topBar.hidden = false;
  bottomBar.hidden = false;
  progressTrack.hidden = false;

  topBar.querySelector(".back").href = backLink;
  topBar.querySelector(".t").textContent = title.title;
  topBar.querySelector(".c").textContent = `Глава ${chapterNum}`;
  progressTrack.querySelector(".num.bottom").textContent = pages.length;

  const pagesEl = document.getElementById("pages");
  for (const url of pages) {
    const img = document.createElement("img");
    img.src = url;
    img.loading = "lazy";
    img.alt = "";
    pagesEl.appendChild(img);
  }

  const prevBtn = bottomBar.querySelector('[data-action="prev"]');
  const nextBtn = bottomBar.querySelector('[data-action="next"]');
  prevBtn.disabled = !prevNum;
  nextBtn.disabled = !nextNum;
  const goto = (num) => { location.href = `reader.html?title=${encodeURIComponent(titleId)}&chapter=${encodeURIComponent(num)}`; };
  prevBtn.addEventListener("click", () => prevNum && goto(prevNum));
  nextBtn.addEventListener("click", () => nextNum && goto(nextNum));
  bottomBar.querySelector('[data-action="top"]').addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  bottomBar.querySelector('[data-action="list"]').addEventListener("click", () => { location.href = backLink; });
  bottomBar.querySelector('[data-action="wide"]').addEventListener("click", () => {
    const wide = document.body.classList.toggle("wide");
    pagesEl.style.setProperty("--reader-width", wide ? "100%" : "720px");
  });

  // Тап по сторінці (поза кнопками/посиланнями) — показати/сховати оверлей.
  document.body.addEventListener("click", (e) => {
    if (e.target.closest(".reader-bar, .progress-track")) return;
    document.body.classList.toggle("ui-hidden");
  });

  // Прогрес читання: збереження позиції + рух повзунка справа.
  const storageKey = `reader-progress:${titleId}:${chapterNum}`;
  const track = progressTrack.querySelector(".track");
  const thumb = progressTrack.querySelector(".thumb");
  const topLabel = progressTrack.querySelector(".num.top");

  function scrollFraction() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    return max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
  }

  function updateProgressUI() {
    const frac = scrollFraction();
    const trackHeight = track.clientHeight;
    thumb.style.top = `${frac * trackHeight}px`;
    topLabel.textContent = Math.max(1, Math.round(frac * (pages.length - 1)) + 1);
  }

  let saveTimer = null;
  window.addEventListener("scroll", () => {
    requestAnimationFrame(updateProgressUI);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(storageKey, String(scrollFraction())); } catch {}
    }, 200);
  }, { passive: true });

  track.addEventListener("click", (e) => {
    const rect = track.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
    const max = document.documentElement.scrollHeight - window.innerHeight;
    window.scrollTo({ top: frac * max });
  });

  // Відновлення збереженої позиції (після того, як розмітка стабілізується).
  try {
    const saved = parseFloat(localStorage.getItem(storageKey));
    if (!isNaN(saved) && saved > 0.01) {
      window.addEventListener("load", () => {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        window.scrollTo({ top: saved * max });
      });
    }
  } catch {}

  updateProgressUI();
})();
</script>
</body>
</html>
