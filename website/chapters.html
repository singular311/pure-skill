<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Глави</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="chapters-page"><a class="back" href="index.html">← До каталогу</a><h1 id="title">Глави</h1><div id="chapters" class="chapter-list"></div></main><script src="data/config.js"></script><script src="data/catalog.js"></script><script src="data/cubari-links.js"></script><script>
const id = new URLSearchParams(location.search).get('title');
const item = window.CATALOG_DATA.titles.find(x => x.id === id);
const cubari = window.CUBARI_LINKS?.[id];
document.querySelector('#title').textContent = item?.title ?? 'Тайтл не знайдено';
document.querySelector('#chapters').innerHTML = item ? item.chapters.slice().reverse().map(c => {
  const ready = cubari?.chapters.includes(String(c.number));
  const action = ready
    ? `<a class="read" href="${cubari.link}${c.number}/">Читати</a>`
    : `<button disabled title="Буде активна після завантаження в R2">Читати</button>`;
  return `<div class="chapter-row"><span>Глава ${c.number}</span>${action}</div>`;
}).join('') : '';
</script></body></html>
